name: Windows desktop candidate
on:
  push:
    branches: [codex/windows-desktop-electron-r1]
permissions:
  contents: read
jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.9.0
          cache: pnpm
      - run: node --test scripts/release/windows-electron/policy.test.cjs
      - name: Build installer from the verified Windows core
        run: ./scripts/release/windows-electron/build.ps1 -OutputDir "$env:RUNNER_TEMP/candidate"
      - name: Bind candidate to source and signing status
        run: |
          $dir = "$env:RUNNER_TEMP/candidate"
          git archive --format=tar.gz --prefix=chuangzuoyoushu-0.1.2/ --output="$dir/chuangzuoyoushu-0.1.2-source.tar.gz" HEAD
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-Item "$dir/chuangzuoyoushu-0.1.2-windows-x64-setup.exe"
          $sign = Get-AuthenticodeSignature -LiteralPath $exe.FullName
          $files = @(Get-ChildItem $dir -File | ForEach-Object { @{file=$_.Name; bytes=$_.Length; sha256=(Get-FileHash $_.FullName).Hash.ToLower()} })
          @{commit=(git rev-parse HEAD);tree=(git rev-parse 'HEAD^{tree}'); files=$files; installerSignature=[string]$sign.Status; signer=$sign.SignerCertificate.Subject; run=$env:GITHUB_RUN_ID} | ConvertTo-Json -Depth 4 > "$dir/candidate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-desktop-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - run: pnpm install --frozen-lockfile
      - name: Exercise installed app with isolated legacy data
        run: node tests/release/windows-electron/verify.mjs "$env:RUNNER_TEMP/candidate/chuangzuoyoushu-0.1.2-windows-x64-setup.exe" "$env:RUNNER_TEMP/chuangzuoyoushu-0.1.1-windows-x64.zip" "$env:RUNNER_TEMP/desktop-verification"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: windows-desktop-verification
          path: ${{ runner.temp }}/desktop-verification/
          if-no-files-found: warn
          retention-days: 14
