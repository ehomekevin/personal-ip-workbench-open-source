name: CI
on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: 固定输入、类型、SQLite规则与浏览器交互
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.9.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Scan source for secrets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks-tool" "$RUNNER_TEMP/source-scan"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks-tool/archive.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks-tool/archive.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks-tool/archive.tar.gz" -C "$RUNNER_TEMP/gitleaks-tool" gitleaks
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-scan"
          "$RUNNER_TEMP/gitleaks-tool/gitleaks" dir "$RUNNER_TEMP/source-scan" --config .gitleaks.toml --redact=100 --ignore-gitleaks-allow
      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile
      - name: 安装媒体回归依赖
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: 校验固定输入、类型与可移植内部规则
        run: pnpm ci:check
      - name: 构建共享插件运行包
        run: pnpm build:plugins
      - name: 打包 Codex 与 Claude 可审查安装产物
        run: |
          node plugins/codex/scripts/package.mjs --out .ci-artifacts/plugins/codex-ci
          node plugins/claude/scripts/package.mjs --out .ci-artifacts/plugins/claude-ci
      - name: 安装 Chromium 和系统依赖
        run: pnpm exec playwright install --with-deps chromium
      - name: 构建并回放桌面与窄视口原型交互
        run: pnpm test:e2e:portable
      - name: 验证生成动效与运营流程吸附的共享交互
        run: pnpm test:e2e:interactions
      - name: 提取可分发的测试状态与计数
        if: always()
        run: node scripts/ci/stage-reports.ts
      - name: 保存测试状态与计数
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/*.json
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 7

  windows-portable:
    name: Windows x64 portable ZIP
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Preserve source bytes for packaged resources
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.32.1
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - name: Build distributable ZIP
        run: node scripts/release/windows/build.mjs "$env:RUNNER_TEMP/release"
      - run: pnpm exec playwright install chromium
      - name: Run the extracted package on Windows
        id: verify_windows
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/release" -Filter '*-windows-x64.zip' -File)
          if ($assets.Count -ne 1) { throw 'Expected one portable ZIP' }
          node tests/release/windows/verify.mjs $assets[0].FullName "$env:RUNNER_TEMP/portable-verification"
      - name: Store the tested ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/*-windows-x64.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Store the Windows test report and browser screenshots
        if: ${{ !cancelled() && steps.verify_windows.outcome != 'skipped' && steps.verify_windows.outcome != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/portable-verification/verification.json
            ${{ runner.temp }}/portable-verification/desktop-future.png
            ${{ runner.temp }}/portable-verification/narrow-future.png
          if-no-files-found: error
          retention-days: 14
