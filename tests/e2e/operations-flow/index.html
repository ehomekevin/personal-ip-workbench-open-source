<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营流程 · 隔离验收</title><style>.fixture-controls{position:fixed;bottom:8px;right:8px;z-index:24;background:#fff;border:1px solid #c4cae7;border-radius:14px;padding:8px;display:flex;gap:6px;font:11px sans-serif;max-width:calc(100vw - 16px)}.fixture-controls button,.fixture-controls select{min-height:36px;border:1px solid #c4cae7;border-radius:8px;background:#eef0fa;font-size:11px;padding:4px 8px}</style></head><body><div id="root"></div><div class="fixture-controls"><select id="fixture-state" aria-label="夹具状态"><option value="partial">简报核心已确认</option><option value="candidate">候选未确认</option><option value="core-unconfirmed">核心稿未确认</option><option value="complete">反馈与后续已确认</option></select><button id="fixture-topic">切换主题</button><button id="fixture-mount">卸载 / 挂载</button></div><script type="module" src="./fixture.tsx"></script></body></html>
